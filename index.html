<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#263e37">
  <title>Mapa de Acordes</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="toolbar">
    <a class="brand" href="./" aria-label="Mapa de Acordes, inicio"><span aria-hidden="true">♮</span> Estudio de acordes</a>
    <div class="actions">
      <button id="export-pdf" type="button">Imprimir / PDF</button>
      <button id="export-png" class="primary" type="button">Descargar PNG <span aria-hidden="true">↗</span></button>
    </div>
  </header>
  <main id="workspace">
    <div class="eyebrow">TU MÚSICA, NOTA A NOTA</div>
    <input id="title" aria-label="Título del mapa" maxlength="100" value="Mapa de Acordes">
    <input id="subtitle" aria-label="Subtítulo del mapa" maxlength="160" placeholder="Añade una canción, una tonalidad o una idea…">
    <div class="sheet-heading"><span>ACORDE</span><span>GRADOS Y NOTAS</span></div>
    <div id="chords-container" aria-label="Acordes"></div>
    <button id="add-row" type="button"><span aria-hidden="true">＋</span> Añadir acorde</button>
    <footer><span>Un espacio para explorar armonías.</span><span id="row-count"></span></footer>
  </main>
  <p id="status" role="status" aria-live="polite"></p>
</body>
</html>
